<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form HLV - BoxingHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #f0f0f0; }
        .navbar { background-color: #1a1a1a; border-bottom: 2px solid #e53935; }
        .navbar-brand { color: #e53935 !important; font-weight: bold; font-size: 1.5rem; }
        .card { background-color: #1a1a1a; border: 1px solid #333; }
        .card-header { background-color: #e53935; color: white; }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #f0f0f0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2a2a2a;
            border-color: #e53935;
            color: #f0f0f0;
            box-shadow: 0 0 0 0.2rem rgba(229, 57, 53, 0.25);
        }
        .form-label { color: #ccc; }
        .btn-save { background-color: #e53935; border: none; color: white; }
        .btn-save:hover { background-color: #c62828; color: white; }
        .form-select option { background-color: #2a2a2a; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand">🥊 BoxingHub</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-light" href="/members">Học viên</a>
            <a class="nav-link text-danger fw-bold" href="/trainers">Huấn luyện viên</a>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Header -->
            <div class="mb-4">
                <h2 class="mb-1"
                    th:text="${trainer.id != null} ? 'Chỉnh sửa HLV' : 'Thêm huấn luyện viên'">
                    Form HLV
                </h2>
                <p class="text-muted mb-0">BoxingHub Trainer Management</p>
            </div>

            <!-- Form Card -->
            <div class="card">
                <div class="card-header py-3">
                    <h5 class="mb-0"
                        th:text="${trainer.id != null} ? '✏️ Cập nhật thông tin' : '➕ Thông tin mới'">
                        Form
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/trainers/save}" th:object="${trainer}" method="post">

                        <!-- Hidden ID (dùng khi edit) -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Họ tên & Email -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control"
                                       th:field="*{fullName}"
                                       placeholder="Nguyễn Văn A" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control"
                                       th:field="*{email}"
                                       placeholder="trainer@boxinghub.com" required />
                            </div>
                        </div>

                        <!-- Phone & Gender -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" class="form-control"
                                       th:field="*{phone}"
                                       placeholder="0901234567" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giới tính</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="">-- Chọn --</option>
                                    <option th:each="g : ${T(com.boxinghub.entity.Gender).values()}"
                                            th:value="${g}"
                                            th:text="${g}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Specialization & Experience -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Chuyên môn</label>
                                <input type="text" class="form-control"
                                       th:field="*{specialization}"
                                       placeholder="Boxing, Muay Thai, Fitness..." />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số năm kinh nghiệm</label>
                                <input type="number" class="form-control"
                                       th:field="*{experienceYears}"
                                       placeholder="5" min="0" max="50" />
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="">-- Chọn trạng thái --</option>
                                <option th:value="ACTIVE">🟢 Active - Đang làm việc</option>
                                <option th:value="INACTIVE">⚫ Inactive - Nghỉ việc</option>
                            </select>
                        </div>

                        <!-- Bio -->
                        <div class="mb-4">
                            <label class="form-label">Giới thiệu bản thân</label>
                            <textarea class="form-control" th:field="*{bio}"
                                      rows="4"
                                      placeholder="Mô tả kinh nghiệm, thành tích, phong cách huấn luyện...">
                            </textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-save px-4">
                                💾 Lưu
                            </button>
                            <a href="/trainers" class="btn btn-outline-secondary px-4">
                                Hủy
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
