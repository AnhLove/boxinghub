<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Form HLV</title>
</head>
<body>

<div layout:fragment="content"
     th:with="activePage='trainers',
              pageTitle=${trainer.id != null ? 'Chỉnh sửa HLV' : 'Thêm HLV'}">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title"
                th:text="${trainer.id != null} ? 'Chỉnh sửa HLV' : 'Thêm huấn luyện viên'">
                Form HLV
            </h1>
            <p class="page-subtitle">BoxingHub Trainer Management</p>
        </div>
        <a href="/admin/trainers" class="btn-red" style="background:var(--bg-4);color:var(--text);border:1px solid var(--border);">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-box">
                <div class="card-box-header">
                    <i class="bi bi-pencil-square"></i>
                    <span th:text="${trainer.id != null} ? 'Cập nhật thông tin' : 'Thông tin mới'">Form</span>
                </div>
                <div style="padding: 24px;">
                    <form th:action="@{/admin/trainers/save}" th:object="${trainer}" method="post">

                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Họ tên & Email -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ tên <span style="color:var(--red)">*</span></label>
                                <input type="text" class="form-control"
                                       th:field="*{fullName}"
                                       placeholder="Nguyễn Văn A" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email <span style="color:var(--red)">*</span></label>
                                <input type="email" class="form-control"
                                       th:field="*{email}"
                                       placeholder="trainer@boxinghub.com" required />
                            </div>
                        </div>

                        <!-- Phone & Gender -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" class="form-control"
                                       th:field="*{phone}"
                                       placeholder="0901234567" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giới tính</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="">-- Chọn --</option>
                                    <option th:each="g : ${T(com.boxinghub.entity.Gender).values()}"
                                            th:value="${g}"
                                            th:text="${g}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Specialization & Experience -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Chuyên môn</label>
                                <input type="text" class="form-control"
                                       th:field="*{specialization}"
                                       placeholder="Boxing, Muay Thai, Fitness..." />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số năm kinh nghiệm</label>
                                <input type="number" class="form-control"
                                       th:field="*{experienceYears}"
                                       placeholder="5" min="0" max="50" />
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="">-- Chọn trạng thái --</option>
                                <option th:value="ACTIVE">🟢 Active - Đang làm việc</option>
                                <option th:value="INACTIVE">⚫ Inactive - Nghỉ việc</option>
                            </select>
                        </div>

                        <!-- Bio -->
                        <div class="mb-4">
                            <label class="form-label">Giới thiệu bản thân</label>
                            <textarea class="form-control" th:field="*{bio}"
                                      rows="4"
                                      placeholder="Mô tả kinh nghiệm, thành tích, phong cách huấn luyện..."></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn-red">
                                <i class="bi bi-save"></i> Lưu
                            </button>
                            <a href="/admin/trainers" class="btn-red"
                               style="background:transparent;color:var(--text-muted);border:1px solid var(--border);">
                                Hủy
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
