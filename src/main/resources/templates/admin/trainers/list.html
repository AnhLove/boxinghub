<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Danh sách HLV</title>
</head>
<body>

<div layout:fragment="content"
     th:with="activePage='trainers', pageTitle='Huấn luyện viên'">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Danh sách huấn luyện viên</h1>
            <p class="page-subtitle">Quản lý toàn bộ HLV BoxingHub</p>
        </div>
        <a href="/admin/trainers/new" class="btn-red">
            <i class="bi bi-plus"></i> Thêm HLV
        </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <div>
                    <div class="stat-num" th:text="${trainers.size()}">0</div>
                    <div class="stat-label">Tổng huấn luyện viên</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔥 SEARCH BAR: Thêm để lọc theo tên HLV -->
    <div class="card-box mb-4" style="padding: 15px;">
        <form th:action="@{/admin/trainers}" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text" style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text-muted);">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" name="keyword" th:value="${keyword}"
                           class="form-control"
                           placeholder="Tìm kiếm theo tên HLV..."
                           style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text);">
                </div>
            </div>
            <div class="col-md-auto">
                <button type="submit" class="btn-red" style="padding: 7px 20px;">
                    <i class="bi bi-filter"></i> Lọc
                </button>
                <a th:href="@{/admin/trainers}" class="btn-edit" style="text-decoration: none; padding: 7px 15px;">
                    <i class="bi bi-arrow-clockwise"></i> Làm mới
                </a>
            </div>
            <div class="col-md-auto ms-auto" th:if="${keyword != null and keyword != ''}">
                <span class="text-muted">Kết quả cho: <strong th:text="${keyword}" style="color: var(--red)"></strong></span>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="card-box">
        <div class="card-box-header">
            <i class="bi bi-list-ul"></i> Danh sách
        </div>
        <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Giới tính</th>
                    <th>Chuyên môn</th>
                    <th>Kinh nghiệm</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="trainer, stat : ${trainers}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${trainer.fullName}"></td>
                    <td th:text="${trainer.email}"></td>
                    <!-- Khớp với 'private String phone' trong Entity -->
                    <td th:text="${trainer.phone != null ? trainer.phone : '—'}"></td>
                    <td>
                        <span th:if="${trainer.gender != null}" th:text="${trainer.gender}"></span>
                        <span th:if="${trainer.gender == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${trainer.specialization != null}" th:text="${trainer.specialization}"></span>
                        <span th:if="${trainer.specialization == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${trainer.experienceYears != null}"
                              th:text="${trainer.experienceYears + ' năm'}"></span>
                        <span th:if="${trainer.experienceYears == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${trainer.status == T(com.boxinghub.entity.TrainerStatus).ACTIVE}"
                              class="badge-pill badge-active">Active</span>
                        <span th:if="${trainer.status == T(com.boxinghub.entity.TrainerStatus).INACTIVE}"
                              class="badge-pill badge-inactive">Inactive</span>
                        <span th:if="${trainer.status == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/trainers/edit/{id}(id=${trainer.id})}"
                           class="btn-edit">Sửa</a>
                        <a th:href="@{/admin/trainers/delete/{id}(id=${trainer.id})}"
                           class="btn-del"
                           onclick="return confirm('Xóa HLV này?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${trainers.isEmpty()}">
                    <td colspan="9">
                        <div class="empty-state">
                            <i class="bi bi-search"></i>
                            <div>Không tìm thấy HLV nào phù hợp. <a th:href="@{/admin/trainers}" style="color:var(--red)">Quay lại!</a></div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
