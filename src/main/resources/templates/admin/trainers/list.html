<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách HLV - BoxingHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #f0f0f0; }
        .navbar { background-color: #1a1a1a; border-bottom: 2px solid #e53935; }
        .navbar-brand { color: #e53935 !important; font-weight: bold; font-size: 1.5rem; }
        .card { background-color: #1a1a1a; border: 1px solid #333; }
        .card-header { background-color: #e53935; color: white; }
        .table { color: #f0f0f0; }
        .table thead { background-color: #2a2a2a; }
        .table tbody tr:hover { background-color: #2a2a2a; }
        .btn-add { background-color: #e53935; border: none; color: white; }
        .btn-add:hover { background-color: #c62828; color: white; }
        .badge-active { background-color: #4caf50; }
        .badge-inactive { background-color: #757575; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand">🥊 BoxingHub</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-light" href="/members">Học viên</a>
            <a class="nav-link text-danger fw-bold" href="/trainers">Huấn luyện viên</a>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Danh sách huấn luyện viên</h2>
            <p class="text-muted mb-0">Quản lý toàn bộ HLV BoxingHub</p>
        </div>
        <a href="/trainers/new" class="btn btn-add px-4">
            + Thêm HLV
        </a>
    </div>

    <!-- Stats -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center p-3">
                <h3 class="text-danger mb-1" th:text="${trainers.size()}">0</h3>
                <p class="text-muted mb-0">Tổng huấn luyện viên</p>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-header py-3">
            <h5 class="mb-0">📋 Danh sách</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-dark table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Giới tính</th>
                    <th>Chuyên môn</th>
                    <th>Kinh nghiệm</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="trainer, stat : ${trainers}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${trainer.fullName}"></td>
                    <td th:text="${trainer.email}"></td>
                    <td th:text="${trainer.phone}"></td>
                    <td>
                        <span th:if="${trainer.gender != null}" th:text="${trainer.gender}"></span>
                        <span th:if="${trainer.gender == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${trainer.specialization != null}" th:text="${trainer.specialization}"></span>
                        <span th:if="${trainer.specialization == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${trainer.experienceYears != null}"
                              th:text="${trainer.experienceYears + ' năm'}"></span>
                        <span th:if="${trainer.experienceYears == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:if="${trainer.status == T(com.boxinghub.entity.TrainerStatus).ACTIVE}"
                              class="badge badge-active">Active</span>
                        <span th:if="${trainer.status == T(com.boxinghub.entity.TrainerStatus).INACTIVE}"
                              class="badge badge-inactive">Inactive</span>
                        <span th:if="${trainer.status == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <a th:href="@{/trainers/edit/{id}(id=${trainer.id})}"
                           class="btn btn-sm btn-outline-warning me-1">Sửa</a>
                        <a th:href="@{/trainers/delete/{id}(id=${trainer.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Xóa HLV này?')">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${trainers.isEmpty()}">
                    <td colspan="9" class="text-center text-muted py-4">
                        Chưa có huấn luyện viên nào. <a href="/trainers/new" class="text-danger">Thêm ngay!</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
