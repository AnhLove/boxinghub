<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title th:text="${member.id == null ? 'Thêm học viên' : 'Sửa học viên'}"></title>
</head>
<body>

<div layout:fragment="content"
     th:with="activePage='members',
              pageTitle=${member.id == null ? 'Thêm học viên' : 'Cập nhật học viên'}">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title"
                th:text="${member.id == null ? 'Thêm học viên mới' : 'Cập nhật học viên'}"></h1>
            <p class="page-subtitle">Điền đầy đủ thông tin bên dưới</p>
        </div>
        <a href="/admin/members" class="btn-red" style="background:var(--bg-4);color:var(--text);border:1px solid var(--border);">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
    </div>

    <!-- Form -->
    <div class="card-box">
        <div class="card-box-header">
            <i class="bi bi-person-plus"></i> Thông tin học viên
        </div>

        <div class="p-4">
            <form th:action="@{/admin/members/save}" th:object="${member}" method="post">

                <!-- ID -->
                <input type="hidden" th:field="*{id}">

                <!-- Họ tên -->
                <div class="mb-3">
                    <label class="form-label">Họ và tên *</label>
                    <input type="text" class="form-control"
                           th:field="*{fullName}"
                           placeholder="Nguyễn Văn A" required>
                </div>

                <!-- Email + Phone -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control"
                               th:field="*{email}"
                               placeholder="example@gmail.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" class="form-control"
                               th:field="*{phone}"
                               placeholder="0901234567">
                    </div>
                </div>

                <!-- Gender + Level -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Giới tính</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">-- Chọn giới tính --</option>
                            <option value="MALE">Nam</option>
                            <option value="FEMALE">Nữ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cấp độ</label>
                        <select class="form-select" th:field="*{level}">
                            <option value="">-- Chọn cấp độ --</option>
                            <option value="BEGINNER">Beginner</option>
                            <option value="INTERMEDIATE">Intermediate</option>
                            <option value="ADVANCED">Advanced</option>
                        </select>
                    </div>
                </div>

                <!-- Weight + Height -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Cân nặng (kg)</label>
                        <input type="number" step="0.1" class="form-control"
                               th:field="*{weight}"
                               placeholder="65.5">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Chiều cao (cm)</label>
                        <input type="number" step="0.1" class="form-control"
                               th:field="*{height}"
                               placeholder="175">
                    </div>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn-red">
                        💾 Lưu học viên
                    </button>
                    <a href="/admin/members" class="btn-red"
                       style="background:transparent;color:var(--text-muted);border:1px solid var(--border);">
                        Hủy
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
