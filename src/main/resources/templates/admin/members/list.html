<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Danh sách học viên</title>
</head>
<body>

<div layout:fragment="content"
     th:with="activePage='members', pageTitle='Học viên'">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Danh sách học viên</h1>
            <p class="page-subtitle">Quản lý toàn bộ học viên BoxingHub</p>
        </div>
        <a href="/admin/members/new" class="btn-red">
            <i class="bi bi-plus"></i> Thêm học viên
        </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div>
                    <div class="stat-num" th:text="${members.size()}">0</div>
                    <div class="stat-label">Tổng học viên</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card-box">
        <div class="card-box-header">
            <i class="bi bi-list-ul"></i> Danh sách
        </div>

        <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Giới tính</th>
                    <th>Cấp độ</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="member, stat : ${members}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${member.fullName}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.phone}"></td>

                    <!-- Gender -->
                    <td>
                        <span th:if="${member.gender != null}" th:text="${member.gender}"></span>
                        <span th:if="${member.gender == null}" class="text-muted">—</span>
                    </td>

                    <!-- Level -->
                    <td>
                        <span th:if="${member.level == T(com.boxinghub.entity.Level).BEGINNER}"
                              class="badge-pill badge-beginner">Beginner</span>

                        <span th:if="${member.level == T(com.boxinghub.entity.Level).INTERMEDIATE}"
                              class="badge-pill badge-intermediate">Intermediate</span>

                        <span th:if="${member.level == T(com.boxinghub.entity.Level).ADVANCED}"
                              class="badge-pill badge-advanced">Advanced</span>

                        <span th:if="${member.level == null}" class="text-muted">—</span>
                    </td>

                    <!-- Actions -->
                    <td>
                        <a th:href="@{/admin/members/edit/{id}(id=${member.id})}"
                           class="btn-edit">Sửa</a>

                        <a th:href="@{/admin/members/delete/{id}(id=${member.id})}"
                           class="btn-del"
                           onclick="return confirm('Xóa học viên này?')">Xóa</a>
                    </td>
                </tr>

                <!-- Empty -->
                <tr th:if="${members.isEmpty()}">
                    <td colspan="7">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <div>
                                Chưa có học viên nào.
                                <a href="/admin/members/new" style="color:var(--red)">Thêm ngay!</a>
                            </div>
                        </div>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
