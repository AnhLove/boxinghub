<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Danh sách học viên</title>
</head>
<body>

<div layout:fragment="content"
     th:with="activePage='members', pageTitle='Học viên'">

    <div class="page-header">
        <div>
            <h1 class="page-title">Danh sách học viên</h1>
            <p class="page-subtitle">Quản lý toàn bộ học viên BoxingHub</p>
        </div>
        <a href="/admin/members/new" class="btn-red">
            <i class="bi bi-plus"></i> Thêm học viên
        </a>
    </div>

    <!-- Thống kê nhanh -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div>
                    <div class="stat-num" th:text="${members != null ? members.size() : 0}">0</div>
                    <div class="stat-label">Tổng học viên</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Thanh tìm kiếm -->
    <div class="card-box mb-4" style="padding: 15px;">
        <form th:action="@{/admin/members}" method="get" class="row g-2 align-items-center">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text" style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text-muted);">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" name="keyword" th:value="${keyword}"
                           class="form-control"
                           placeholder="Tìm kiếm theo tên..."
                           style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text);">
                </div>
            </div>
            <div class="col-md-auto">
                <button type="submit" class="btn-red" style="padding: 7px 20px;">
                    <i class="bi bi-filter"></i> Lọc
                </button>
                <a th:href="@{/admin/members}" class="btn-edit" style="text-decoration: none; padding: 7px 15px;">
                    <i class="bi bi-arrow-clockwise"></i> Làm mới
                </a>
            </div>
        </form>
    </div>

    <div class="card-box">
        <div class="card-box-header">
            <i class="bi bi-list-ul"></i> Danh sách học viên
        </div>

        <div style="overflow-x: auto;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Giới tính</th>
                    <th>Chiều cao</th>
                    <th>Cân nặng</th>
                    <th>Số buổi tập</th>
                    <th>Cấp độ</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="member, stat : ${members}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${member.fullName}"></td>

                    <!-- Email an toàn -->
                    <td th:text="${member.user != null ? member.user.email : 'Chưa có tài khoản'}"></td>

                    <td th:text="${member.phone != null && !member.phone.isEmpty() ? member.phone : '—'}"></td>

                    <!-- Sửa lỗi hiển thị Enum Gender -->
                    <td>
                        <span th:if="${member.gender != null}"
                              th:text="${member.gender.name() == 'MALE' ? 'Nam' : 'Nữ'}"></span>
                        <span th:if="${member.gender == null}" class="text-muted">—</span>
                    </td>

                    <td>
                        <span th:text="${member.height != null ? member.height + ' cm' : '—'}"></span>
                    </td>

                    <td>
                        <span th:text="${member.weight != null ? member.weight + ' kg' : '—'}"></span>
                    </td>

                    <!-- Số buổi tập -->
                    <td>
                        <span class="badge bg-light text-dark border"
                              th:text="${member.remainingSessions != null ? member.remainingSessions : 0}">0</span>
                    </td>

                    <td>
                        <!-- Cấp độ -->
                        <span th:if="${member.level != null}">
                            <span th:if="${member.level.name() == 'BEGINNER'}" class="badge-pill badge-beginner">Beginner</span>
                            <span th:if="${member.level.name() == 'INTERMEDIATE'}" class="badge-pill badge-intermediate">Intermediate</span>
                            <span th:if="${member.level.name() == 'ADVANCED'}" class="badge-pill badge-advanced">Advanced</span>
                        </span>
                        <span th:if="${member.level == null}" class="text-muted">—</span>
                    </td>

                    <td>
                        <div class="d-flex gap-2">
                            <!-- Sử dụng data- attribute thay vì nhúng trực tiếp vào onclick để tránh lỗi dấu nháy -->
                            <button type="button" class="btn-edit"
                                    style="background-color: #28a745; color: white; border: none;"
                                    th:data-id="${member.id}"
                                    th:data-name="${member.fullName}"
                                    onclick="openSessionModal(this.getAttribute('data-id'), this.getAttribute('data-name'))">
                                Nạp
                            </button>
                            <a th:href="@{/admin/members/edit/{id}(id=${member.id})}"
                               class="btn-edit">Sửa</a>
                            <a th:href="@{/admin/members/delete/{id}(id=${member.id})}"
                               class="btn-del"
                               onclick="return confirm('Xóa học viên này?')">Xóa</a>
                        </div>
                    </td>
                </tr>

                <!-- Sửa colspan lên 8 cho khớp với thead -->
                <tr th:if="${members == null || members.isEmpty()}">
                    <td colspan="8">
                        <div class="empty-state">
                            <i class="bi bi-inbox" style="font-size: 2rem; color: var(--text-muted);"></i>
                            <div class="mt-2">Chưa có học viên nào phù hợp.</div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
<!-- Modal Nạp Buổi -->
<div class="modal fade" id="addSessionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: var(--bg-2); border: 1px solid var(--border); color: var(--text);">
            <div class="modal-header" style="border-bottom: 1px solid var(--border);">
                <h5 class="modal-title">Nạp buổi tập cho: <span id="displayMemberName" class="text-danger"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- Endpoint đã khớp với Controller -->
            <form th:action="@{/admin/members/add-sessions-direct}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="modalMemberId">
                    <div class="mb-3">
                        <label class="form-label">Số lượng buổi muốn nạp</label>
                        <input type="number" name="amount" class="form-control"
                               style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text);"
                               value="10" min="1" required>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--border);">
                    <button type="button" class="btn-edit" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn-red">Xác nhận nạp</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>


<th:block layout:fragment="script">
    <script th:src="@{/js/member-management.js}"></script>
</th:block>

</body>
</html>
