<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title th:text="${isEdit} ? 'Cập nhật lớp tập' : 'Thêm lớp tập'">Form lớp tập</title>
</head>
<body>

<div layout:fragment="content"
     th:with="activePage='group-classes', pageTitle=${isEdit} ? 'Cập nhật lớp tập' : 'Thêm lớp tập'">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${isEdit} ? 'Cập nhật lớp tập' : 'Thêm lớp tập'">Form lớp tập</h1>
            <p class="page-subtitle">Quản lý lớp tập BoxingHub</p>
        </div>
        <a href="/admin/group-classes" class="btn-red" style="background:var(--bg-4);color:var(--text);border:1px solid var(--border);">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-box">
                <div class="card-box-header">
                    <i class="bi bi-pencil-square"></i>
                    <span th:text="${isEdit} ? 'Chỉnh sửa lớp tập' : 'Thêm lớp tập'">Form</span>
                </div>
                <div style="padding: 24px;">
                    <form th:action="@{${action}}" th:object="${groupClass}" method="post">

                        <!-- Hidden ID for edit -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Tên lớp & HLV -->
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label class="form-label">Tên lớp <span style="color:var(--red)">*</span></label>
                                <input type="text" class="form-control" th:field="*{className}" placeholder="Tên lớp tập" required />
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Huấn luyện viên</label>
                                <select name="trainerId" class="form-select" required>
                                    <option value="">-- Chọn HLV --</option>
                                    <option th:each="tr : ${trainers}"
                                            th:value="${tr.id}"
                                            th:text="${tr.fullName}"
                                            th:selected="${groupClass.trainer != null && groupClass.trainer.id == tr.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Lịch học & Thời lượng -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Lịch học</label>
                                <input type="datetime-local" class="form-control" th:field="*{schedule}" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Thời lượng (phút)</label>
                                <input type="number" class="form-control" th:field="*{durationMinutes}" min="0" />
                            </div>
                        </div>

                        <!-- Sức chứa & Giá -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Sức chứa</label>
                                <input type="number" class="form-control" th:field="*{capacity}" min="1" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giá (VNĐ)</label>
                                <input type="number" class="form-control" th:field="*{price}" step="0.01" min="0" />
                            </div>
                        </div>

                        <!-- Trạng thái -->
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="" th:selected="${groupClass.status == null}">-- Chọn trạng thái --</option>
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                            </select>
                        </div>

                        <!-- Mô tả -->
                        <div class="mb-4">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Mô tả chi tiết lớp học…"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn-red">
                                <i class="bi bi-save"></i> Lưu
                            </button>
                            <a href="/admin/group-classes" class="btn-red"
                               style="background:transparent;color:var(--text-muted);border:1px solid var(--border);">
                                Hủy
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
