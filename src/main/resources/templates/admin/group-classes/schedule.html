<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content" th:with="activePage='schedule', pageTitle='Lịch tập nhóm'">
    <div class="card-box" style="padding: 20px; background: white; border-radius: 10px;">
        <div id='calendar'></div>
    </div>

    <!-- FullCalendar JS & CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek', // Xem theo tuần sẽ trực quan hơn cho phòng tập
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                slotMinTime: '06:00:00', // Giờ mở cửa
                slotMaxTime: '22:00:00', // Giờ đóng cửa
                locale: 'vi',
                events: '/admin/group-classes/api/events', // Gọi đến API bạn vừa sửa ở trên
                eventClick: function(info) {
                    if (info.event.url) {
                        window.location.href = info.event.url;
                        return false;
                    }
                }
            });
            calendar.render();
        });
    </script>
</div>
</body>
</html>
