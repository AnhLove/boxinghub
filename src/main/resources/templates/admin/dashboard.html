<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">

<head>
    <title>Dashboard</title>
</head>

<body>

<!-- 🔥 TRUYỀN BIẾN CHO LAYOUT -->
<th:block th:with="activePage='dashboard', pageTitle='Dashboard'"></th:block>

<div layout:fragment="content">

    <!-- HEADER -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Tổng quan hệ thống BoxingHub</p>
        </div>
    </div>

    <!-- STATS -->
    <div class="row g-3 mb-4">

        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div>
                    <div class="stat-num" th:text="${totalMembers}">0</div>
                    <div class="stat-label">Tổng học viên</div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="bi bi-person-badge-fill"></i>
                </div>
                <div>
                    <div class="stat-num" th:text="${totalTrainers}">0</div>
                    <div class="stat-label">Huấn luyện viên</div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="bi bi-calendar-check"></i>
                </div>
                <div>
                    <div class="stat-num">—</div>
                    <div class="stat-label">Lịch tập (sắp có)</div>
                </div>
            </div>
        </div>

    </div>

    <!-- QUICK ACTION -->
    <div class="row g-3">

        <div class="col-md-6">
            <div class="card-box">
                <div class="card-box-header">
                    <i class="bi bi-people"></i> Học viên
                </div>

                <div class="card-body-actions">
                    <a href="/admin/members" class="btn-red">
                        <i class="bi bi-list-ul"></i> Xem danh sách
                    </a>

                    <a href="/admin/members/new" class="btn-outline">
                        <i class="bi bi-plus"></i> Thêm mới
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card-box">
                <div class="card-box-header">
                    <i class="bi bi-person-badge"></i> Huấn luyện viên
                </div>

                <div class="card-body-actions">
                    <a href="/admin/trainers" class="btn-red">
                        <i class="bi bi-list-ul"></i> Xem danh sách
                    </a>

                    <a href="/admin/trainers/new" class="btn-outline">
                        <i class="bi bi-plus"></i> Thêm mới
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
