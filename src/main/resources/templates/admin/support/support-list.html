<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}" lang="vi">
<head>
    <title>Quản lý báo lỗi - BoxingHub</title>
    <style>
        .status-badge { width: 105px; display: inline-block; text-align: center; padding: 6px 0; }
        .ticket-content {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }
        /* Ép style trực tiếp để đảm bảo ăn Dark Mode theo biến hệ thống */
        .card-box { background: var(--bg-2); border-radius: 12px; border: 1px solid var(--border); }
        .table thead th { border-top: none; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; background: var(--bg-3); }
        .table { color: var(--text); }

        /* Fix lỗi hiển thị nút giống trang Member */
        .btn-red { background: #e53935; color: white; border: none; border-radius: 6px; transition: 0.2s; }
        .btn-red:hover { background: #c62828; color: white; }
    </style>
</head>
<body>

<div layout:fragment="content" th:with="activePage='admin-support', pageTitle='Quản lý báo lỗi'">

    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="page-title mb-1">Yêu cầu hỗ trợ & Báo lỗi</h1>
            <p class="page-subtitle text-muted mb-0">Hệ thống ghi nhận tổng cộng <span class="fw-bold text-danger" th:text="${tickets != null ? #lists.size(tickets) : 0}">0</span> khiếu nại.</p>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card-box p-0 overflow-hidden shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th class="ps-4" style="width: 15%">Ngày gửi</th>
                <th style="width: 20%">Học viên</th>
                <th style="width: 15%">Phân loại</th>
                <th style="width: 25%">Chi tiết lỗi</th>
                <th class="text-center" style="width: 10%">Trạng thái</th>
                <th class="text-end pe-4" style="width: 15%">Xử lý</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tickets}">
                <td class="ps-4">
                    <div class="fw-semibold" th:text="${t.createdAt != null ? #temporals.format(t.createdAt, 'dd/MM/yyyy') : '--/--/----'}"></div>
                    <small class="text-muted" th:text="${t.createdAt != null ? #temporals.format(t.createdAt, 'HH:mm') : ''}"></small>
                </td>
                <td>
                    <div class="fw-bold text-danger" th:text="${t.member != null ? t.member.fullName : 'N/A'}"></div>

                    <small class="text-muted"
                           th:text="${(t.member != null && t.member.user != null) ? t.member.user.email : ''}">
                    </small>
                </td>
                <td>
                    <span class="badge bg-secondary-subtle text-secondary border" th:text="${t.category}"></span>
                    <div class="mt-1 small fw-bold" th:text="${t.title}"></div>
                </td>
                <td>
                    <div class="ticket-content text-muted"
                         data-bs-toggle="tooltip"
                         data-bs-placement="top"
                         th:title="${t.content}"
                         th:text="${t.content}">
                    </div>
                </td>
                <td class="text-center">
                    <th:block th:if="${t.status != null}">
                        <span th:if="${t.status.name() == 'PENDING'}" class="badge bg-warning text-dark status-badge">Chờ xử lý</span>
                        <span th:if="${t.status.name() == 'IN_PROGRESS'}" class="badge bg-primary status-badge">Đang sửa</span>
                        <span th:if="${t.status.name() == 'RESOLVED'}" class="badge bg-success status-badge">Đã xong</span>
                        <span th:if="${t.status.name() == 'REJECTED'}" class="badge bg-danger status-badge">Từ chối</span>
                    </th:block>
                </td>
                <td class="text-end pe-4">
                    <form th:action="@{/admin/support/update-status}" method="post" class="d-flex gap-2 justify-content-end">
                        <input type="hidden" name="ticketId" th:value="${t.id}">
                        <select name="status" class="form-select form-select-sm"
                                style="width: 120px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text);">
                            <option value="PENDING" th:selected="${t.status?.name() == 'PENDING'}">Chờ</option>
                            <option value="IN_PROGRESS" th:selected="${t.status?.name() == 'IN_PROGRESS'}">Đang sửa</option>
                            <option value="RESOLVED" th:selected="${t.status?.name() == 'RESOLVED'}">Xong</option>
                            <option value="REJECTED" th:selected="${t.status?.name() == 'REJECTED'}">Từ chối</option>
                        </select>
                        <button type="submit" class="btn-red" style="padding: 4px 12px; font-size: 0.85rem;">Lưu</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${tickets == null || #lists.isEmpty(tickets)}">
                <td colspan="6" class="text-center py-5">
                    <i class="bi bi-inbox text-muted" style="font-size: 2rem;"></i>
                    <p class="mt-2 text-muted">Hiện tại không có báo lỗi nào.</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/admin/support-management.js}"></script>
</th:block>
</body>
</html>
