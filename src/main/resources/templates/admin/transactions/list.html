<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Lịch sử nạp buổi tập</title>
</head>
<body>

<div layout:fragment="content" th:with="activePage='transactions', pageTitle='Quản lý nạp buổi'">

    <div class="page-header">
        <div>
            <h1 class="page-title">Quản lý giao dịch nạp</h1>
            <p class="page-subtitle">Theo dõi và thực hiện nạp buổi tập cho học viên</p>
        </div>
    </div>

    <div class="row g-4">
        <!-- Cột trái: Form nạp tiền nhanh -->
        <div class="col-md-4">
            <div class="card-box">
                <div class="card-box-header">
                    <i class="bi bi-plus-circle-fill"></i> Thực hiện nạp nhanh
                </div>
                <div style="padding: 20px;">
                    <form th:action="@{/admin/transactions/add-credit}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Chọn học viên</label>
                            <select name="memberId" class="form-select select2-enable"
                                    style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text);" required>
                                <option value="">-- Chọn học viên --</option>
                                <option th:each="m : ${members}"
                                        th:value="${m.id}"
                                        th:text="${m.fullName + ' (' + m.phone + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số buổi tập</label>
                            <input type="number" name="amount" class="form-control"
                                   value="10" min="1"
                                   style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text);" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi chú</label>
                            <textarea name="note" class="form-control" rows="2"
                                      placeholder="Nạp trực tiếp, Khuyến mãi..."
                                      style="background: var(--bg-3); border: 1px solid var(--border); color: var(--text);"></textarea>
                        </div>
                        <button type="submit" class="btn-red w-100">
                            <i class="bi bi-check-circle"></i> Xác nhận nạp
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Cột phải: Bảng lịch sử giao dịch -->
            <div class="col-md-8">
                <div class="card-box">
                    <div class="card-box-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-clock-history"></i> Lịch sử giao dịch gần đây</span>
                        <span class="badge bg-secondary" th:text="${transactions.size() + ' bản ghi'}"></span>
                    </div>
                    <div class="table-responsive" style="padding: 15px;">
                        <div th:if="${success}" class="alert alert-success py-2 px-3" th:text="${success}"></div>
                        <div th:if="${error}" class="alert alert-danger py-2 px-3" th:text="${error}"></div>

                        <table class="admin-table">
                            <thead>
                            <tr>
                                <th>Ngày & Giờ</th>
                                <th>Học viên</th>
                                <th>Số buổi</th>
                                <th>Chi tiết</th> <th>Trạng thái</th> <th>Hành động</th> </tr>
                            </thead>
                            <tbody>
                            <tr th:each="t : ${transactions}">
                                <td th:text="${#temporals.format(t.transactionDate, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span style="font-weight: 600;" th:text="${t.member.fullName}"></span>
                                    <div th:if="${t.paymentCode}" class="small text-primary" th:text="${'Mã: ' + t.paymentCode}"></div>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:text="${'+' + t.amount}"></span>
                                </td>
                                <td>
                                    <span th:if="${t.moneyAmount}" th:text="${#numbers.formatDecimal(t.moneyAmount, 0, 'COMMA', 0, 'POINT') + 'đ'}"></span>
                                    <span th:unless="${t.moneyAmount}" class="text-muted">--</span>
                                </td>
                                <td>
                                    <span th:if="${t.status != null and t.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Chờ duyệt</span>
                                    <span th:if="${t.status == null or t.status.name() == 'SUCCESS'}" class="badge bg-success">Thành công</span>
                                    <span th:if="${t.status != null and t.status.name() == 'CANCELLED'}" class="badge bg-danger">Đã hủy</span>
                                </td>
                                <td>
                                    <div th:if="${t.status != null and t.status.name() == 'PENDING'}">
                                        <form th:action="@{/admin/transactions/approve/{id}(id=${t.id})}" method="post"
                                              onsubmit="return confirm('Xác nhận đã nhận đủ tiền và cộng buổi cho học viên?')">
                                            <button type="submit" class="btn btn-sm btn-success p-1 px-2">
                                                <i class="bi bi-check-lg"></i> Duyệt
                                            </button>
                                        </form>
                                    </div>
                                    <span th:unless="${t.status != null and t.status.name() == 'PENDING'}" class="text-muted small">N/A</span>
                                </td>
                            </tr>
                            <tr th:if="${transactions.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">Chưa có giao dịch nào.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
