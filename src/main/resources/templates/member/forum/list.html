<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}" lang="vi">
<head>
    <title>Diễn đàn BoxingHub</title>
    <style>
        .post-card { background: var(--bg-2); border-radius: 12px; border: 1px solid var(--border); transition: 0.3s; position: relative; }
        .post-card:hover { border-color: var(--danger); }
        .author-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--bg-3); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--danger); border: 2px solid var(--border); }
        .post-content { white-space: pre-wrap; color: var(--text); }
        .action-btn { color: var(--text-muted); transition: 0.2s; cursor: pointer; text-decoration: none; font-size: 0.9rem; border: none; background: none; padding: 0; }
        .action-btn:hover { color: var(--danger); }
        .media-container { background: #000; border-radius: 8px; overflow: hidden; max-height: 500px; display: flex; align-items: center; justify-content: center; }
        .media-container img, .media-container video { max-width: 100%; max-height: 500px; object-fit: contain; }
        .btn-delete-post { position: absolute; top: 1.5rem; right: 1.5rem; color: var(--text-muted); opacity: 0.5; transition: 0.3s; }
        .btn-delete-post:hover { color: var(--danger); opacity: 1; }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="page-header mb-4">
        <h1 class="page-title">Cộng đồng Boxing</h1>
        <p class="page-subtitle text-muted">Chia sẻ kỹ thuật và kết nối cùng các võ sĩ khác.</p>
    </div>

    <div class="post-card p-4 mb-4 shadow-sm">
        <form th:action="@{/member/forum/create}" method="post" enctype="multipart/form-data" id="forumForm">
            <div class="d-flex gap-3 mb-3">
                <div class="author-avatar" th:text="${#strings.substring(session.userFullName ?: 'U', 0, 1)}">U</div>
                <div class="flex-grow-1">
                    <input type="text" name="title" class="form-control border-0 bg-light mb-2 fw-bold"
                           placeholder="Tiêu đề bài viết..." required style="background: var(--bg-3) !important; color: var(--text);">
                    <textarea name="content" class="form-control border-0 bg-light" rows="3"
                              placeholder="Bạn đang nghĩ gì?" required style="background: var(--bg-3) !important; color: var(--text);"></textarea>

                    <div class="mt-2 d-flex align-items-center gap-2">
                        <label class="btn btn-sm btn-outline-secondary rounded-pill">
                            <i class="bi bi-camera-reels me-1"></i> Ảnh/Video
                            <input type="file" name="file" id="fileInput" hidden accept="image/*,video/*"
                                   onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name">
                        </label>
                        <small id="fileNameDisplay" class="text-muted"></small>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-end border-top pt-3">
                <button type="submit" class="btn btn-danger px-4 rounded-pill">
                    <i class="bi bi-send-fill me-2"></i>Đăng bài
                </button>
            </div>
        </form>
    </div>

    <div class="row justify-content-center">
        <div class="col-12" th:each="p : ${posts}">
            <div class="post-card p-4 mb-3 shadow-sm">

                <div th:if="${p.author.user.email == #authentication.name}" class="btn-delete-post">
                    <form th:action="@{/member/forum/delete/{id}(id=${p.id})}" method="post"
                          onsubmit="return confirm('Bạn có chắc muốn xóa bài viết này không?')">
                        <button type="submit" class="btn btn-link text-decoration-none p-0 text-muted">
                            <i class="bi bi-trash3-fill"></i>
                        </button>
                    </form>
                </div>

                <div class="d-flex align-items-center mb-3">
                    <div class="author-avatar me-3" th:text="${#strings.substring(p.author.fullName, 0, 1)}">B</div>
                    <div>
                        <div class="fw-bold text-danger" th:text="${p.author.fullName}">Tên</div>
                        <small class="text-muted" th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>

                <h4 class="fw-bold mb-2" th:text="${p.title}"></h4>
                <div class="post-content mb-3" th:text="${p.content}"></div>

                <div th:if="${p.mediaUrl != null}" class="media-container mb-3">
                    <img th:if="${p.mediaType == 'IMAGE'}" th:src="${p.mediaUrl}" alt="Post image">
                    <video th:if="${p.mediaType == 'VIDEO'}" controls>
                        <source th:src="${p.mediaUrl}" type="video/mp4">
                    </video>
                </div>

                <div class="d-flex border-top pt-3 gap-4">
                    <button class="action-btn fw-semibold" th:onclick="'handleLike(' + ${p.id} + ')'">
                        <i class="bi bi-heart me-1" th:id="'like-icon-' + ${p.id}"></i>
                        <span th:id="'like-count-' + ${p.id}" th:text="${p.likes ?: 0}">0</span> Thích
                    </button>
                    <a th:href="@{/member/forum/post/{id}(id=${p.id})}" class="action-btn fw-semibold">
                        <i class="bi bi-chat-left-text me-1"></i> Bình luận
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/forum.js}"></script>
</th:block>

</body>
</html>
