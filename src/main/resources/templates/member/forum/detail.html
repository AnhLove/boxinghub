<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}" lang="vi">
<head>
    <title th:text="${post.title} + ' | BoxingHub'"></title>
    <style>
        .detail-card {
            background: var(--bg-2);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .post-full-content {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #212529 !important;
        }

        [data-theme='dark'] .post-full-content {
            color: #f8f9fa !important;
        }

        .comment-item {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .comment-body {
            font-size: 1rem;
            line-height: 1.5;
            font-weight: 500;
            color: #343a40 !important;
        }

        [data-theme='dark'] .comment-body {
            color: #e9ecef !important;
        }

        .author-avatar {
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            background: var(--bg-3);
        }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="mb-4">
        <a href="/member/forum" class="btn btn-link text-muted p-0 text-decoration-none">
            <i class="bi bi-chevron-left"></i> Quay lại diễn đàn
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <article class="detail-card p-4 p-md-5 shadow">
                <div class="d-flex align-items-center mb-4">
                    <img th:src="${post.author.avatarUrl != null ? post.author.avatarUrl : '/assets/images/users/user-default.png'}"
                         class="author-avatar me-3"
                         style="width: 55px; height: 55px;" alt="Author Avatar">
                    <div>
                        <h5 class="fw-bold text-danger mb-0" th:text="${post.author.fullName}"></h5>
                        <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>

                <h1 class="fw-bold mb-3" th:text="${post.title}" style="color: var(--text);"></h1>
                <div class="post-full-content mb-4" th:text="${post.content}"></div>

                <div th:if="${post.mediaUrl != null}" class="large-media-container mb-4">
                    <img th:if="${post.mediaType == 'IMAGE'}" th:src="${post.mediaUrl}" alt="Post detail image" class="img-fluid rounded shadow-sm">
                    <video th:if="${post.mediaType == 'VIDEO'}" controls class="w-100 rounded shadow-sm">
                        <source th:src="${post.mediaUrl}" type="video/mp4">
                    </video>
                </div>

                <hr class="my-5" style="border-color: var(--border);">

                <section>
                    <h4 class="fw-bold mb-4" style="color: var(--text);">
                        <i class="bi bi-chat-dots me-2 text-danger"></i> Thảo luận
                        (<span th:id="'comment-count-' + ${post.id}" th:text="${#lists.size(post.comments)}">0</span>)
                    </h4>

                    <div class="mb-5">
                        <form class="ajax-comment-form" th:data-post-id="${post.id}">
                            <div class="d-flex gap-3">
                                <img th:src="${currentMember.avatarUrl != null ? currentMember.avatarUrl : '/assets/images/users/user-default.png'}"
                                     class="author-avatar d-none d-md-block"
                                     style="width: 45px; height: 45px;"
                                     alt="My Avatar"
                                     onerror="this.src='/assets/images/users/user-default.png'">

                                <div class="flex-grow-1">
                <textarea name="content" class="form-control mb-2 border-0 comment-input" rows="3"
                          placeholder="Viết ý kiến của bạn..." required
                          style="background: var(--bg-3) !important; color: var(--text); border-radius: 12px; resize: none;"></textarea>
                                    <div class="text-end">
                                        <button type="submit" class="btn btn-danger px-4 rounded-pill fw-bold">
                                            <i class="bi bi-send me-1"></i> Gửi bình luận
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="comment-list" th:id="'comment-list-' + ${post.id}">
                        <div th:each="c : ${post.comments}" class="comment-item d-flex gap-3">
                            <img th:src="${c.author.avatarUrl != null ? c.author.avatarUrl : '/assets/images/users/user-default.png'}"
                                 class="author-avatar"
                                 style="width: 40px; height: 40px;" alt="Commenter Avatar">
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="fw-bold text-danger" th:text="${c.author.fullName}"></span>
                                    <small class="text-muted" style="font-size: 0.75rem;"
                                           th:text="${#temporals.format(c.createdAt, 'HH:mm dd/MM/yyyy')}">
                                    </small>
                                    <button class="btn btn-link btn-sm p-0 text-muted"
                                            th:onclick="'openReportModal(\'COMMENT\', ' + ${c.id} + ')'">
                                        <i class="bi bi-flag" style="font-size: 0.75rem;"></i>
                                    </button>
                                </div>
                                <div class="comment-body" th:text="${c.content}"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </article>
        </div>
    </div>
    <!-- Modal Báo cáo -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background: var(--bg-2); border: 1px solid var(--border);">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold" style="color: var(--text);">
                        <i class="bi bi-flag-fill text-danger me-2"></i>Báo cáo nội dung
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Chọn lý do báo cáo:</p>
                    <div class="d-flex flex-column gap-2">
                        <label class="d-flex align-items-center gap-2 p-2 rounded"
                               style="cursor:pointer; border: 1px solid var(--border);">
                            <input type="radio" name="reportReason" value="Spam hoặc quảng cáo"> Spam hoặc quảng cáo
                        </label>
                        <label class="d-flex align-items-center gap-2 p-2 rounded"
                               style="cursor:pointer; border: 1px solid var(--border);">
                            <input type="radio" name="reportReason" value="Ngôn ngữ thù địch"> Ngôn ngữ thù địch / xúc phạm
                        </label>
                        <label class="d-flex align-items-center gap-2 p-2 rounded"
                               style="cursor:pointer; border: 1px solid var(--border);">
                            <input type="radio" name="reportReason" value="Nội dung không phù hợp"> Nội dung không phù hợp
                        </label>
                        <label class="d-flex align-items-center gap-2 p-2 rounded"
                               style="cursor:pointer; border: 1px solid var(--border);">
                            <input type="radio" name="reportReason" value="Thông tin sai lệch"> Thông tin sai lệch
                        </label>
                        <label class="d-flex align-items-center gap-2 p-2 rounded"
                               style="cursor:pointer; border: 1px solid var(--border);">
                            <input type="radio" name="reportReason" value="Khác"> Lý do khác
                        </label>
                    </div>
                    <textarea id="report-custom-reason" class="form-control mt-3 shadow-none" rows="2"
                              placeholder="Mô tả thêm (tùy chọn)..."
                              style="background: var(--bg-3); color: var(--text); border: 1px solid var(--border); resize: none;"></textarea>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger btn-sm px-4 fw-bold" onclick="submitReport()">
                        <i class="bi bi-flag-fill me-1"></i>Gửi báo cáo
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/forum.js}"></script>
    <script th:src="@{/js/reportmb.js}"></script>
</th:block>
</body>
</html>
