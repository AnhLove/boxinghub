<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Học viên - BoxingHub</title>
</head>
<body>

<div layout:fragment="content" th:with="activePage='dashboard', pageTitle='Học viên'">

    <!-- Header Cá nhân -->
    <div class="page-header d-flex justify-content-between align-items-center">
        <div>
            <h1 class="page-title">Chào mừng, <span th:text="${member.fullName}">Học viên</span>!</h1>
            <p class="page-subtitle">Hôm nay bạn đã sẵn sàng tập luyện chưa?</p>
        </div>
        <div>
            <a href="/member/schedule" class="btn-red">
                <i class="bi bi-calendar-check"></i> Đăng ký lớp ngay
            </a>
        </div>
    </div>

    <!-- Chỉ số cá nhân (Dùng Stat Card của bạn nhưng đổi Icon) -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon green"><i class="bi bi-ticket-perforated"></i></div>
                <div>
                    <div class="stat-num" th:text="${member.remainingSessions}">12</div>
                    <div class="stat-label">Buổi tập còn lại</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon red"><i class="bi bi-trophy"></i></div>
                <div>
                    <div class="stat-num" th:text="${member.level != null ? member.level : 'N/A'}">BEGINNER</div>
                    <div class="stat-label">Cấp độ hiện tại</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(13, 110, 253, 0.1); color: #0d6efd;"><i class="bi bi-rulers"></i></div>
                <div>
                    <div class="stat-num" th:text="${member.height != null ? member.height + ' cm' : '--'}">175 cm</div>
                    <div class="stat-label">Chiều cao</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(255, 193, 7, 0.1); color: #ffc107;"><i class="bi bi-speedometer"></i></div>
                <div>
                    <div class="stat-num" th:text="${member.weight != null ? member.weight + ' kg' : '--'}">70 kg</div>
                    <div class="stat-label">Cân nặng</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lịch tập cá nhân (Thay vì bảng lớp học của Admin) -->
    <div class="card-box">
        <div class="card-box-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-calendar-check"></i> Lịch tập của tôi trong tuần</span>
            <a href="/member/my-history" class="text-red" style="font-size: 0.85rem; text-decoration: none;">Xem lịch sử</a>
        </div>
        <div class="table-responsive" style="padding: 15px;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Lớp học</th>
                    <th>Huấn luyện viên</th>
                    <th>Thời gian</th>
                    <th>Địa điểm</th>
                </tr>
                </thead>
                <tbody>
                <!-- Giả sử bạn sẽ truyền danh sách lớp đã đăng ký vào biến 'myClasses' -->
                <tr th:each="c : ${myClasses}">
                    <td th:text="${c.className}" style="font-weight: 500;"></td>
                    <td th:text="${c.trainerName}"></td>
                    <td th:text="${#temporals.format(c.schedule, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>Phòng tập A</td>
                </tr>
                <tr th:if="${myClasses == null or myClasses.isEmpty()}">
                    <td colspan="4" class="text-center py-4 text-muted">Bạn chưa đăng ký lớp học nào tuần này.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
