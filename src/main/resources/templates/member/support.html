<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}" lang="vi">
<head><title>Hỗ trợ - BoxingHub</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header mb-4">
        <h1 class="page-title">Hỗ trợ & Báo lỗi</h1>
        <p class="page-subtitle text-muted">Gửi phản hồi về cơ sở vật chất hoặc lỗi kỹ thuật cho Admin.</p>
    </div>

    <div class="card-box mb-4 shadow-sm border-0">
        <form th:action="@{/member/support/send}" method="post">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label fw-bold">Tiêu đề</label>
                    <input type="text" name="title" class="form-control" placeholder="Ví dụ: Hỏng bao cát, Lỗi app..." required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Loại vấn đề</label>
                    <select name="category" class="form-select">
                        <option value="Facilities">Cơ sở vật chất</option>
                        <option value="Technical">Lỗi kỹ thuật</option>
                        <option value="Trainer">Phàn nàn HLV</option>
                        <option value="Other">Khác</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label fw-bold">Nội dung chi tiết</label>
                    <textarea name="content" class="form-control" rows="3" required></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-danger px-4">Gửi yêu cầu</button>
        </form>
    </div>

    <div class="card-box p-0 overflow-hidden shadow-sm border-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
            <tr>
                <th class="ps-4">Ngày gửi</th>
                <th>Tiêu đề</th>
                <th>Loại</th>
                <th class="text-center">Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tickets}">
                <td class="ps-4" th:text="${#temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="fw-bold" th:text="${t.title}"></td>
                <td><span class="badge bg-secondary" th:text="${t.category}"></span></td>
                <td class="text-center">
                    <th:block th:if="${t.status != null}">
                        <span th:if="${t.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Đang chờ</span>
                        <span th:if="${t.status.name() == 'IN_PROGRESS'}" class="badge bg-primary">Đang xử lý</span>
                        <span th:if="${t.status.name() == 'RESOLVED'}" class="badge bg-success">Đã hoàn thành</span>
                        <span th:if="${t.status.name() == 'REJECTED'}" class="badge bg-danger">Đã từ chối</span>
                    </th:block>
                    <span th:if="${t.status == null}" class="text-muted">--</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
</html>
