<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
    <title>Nhật ký tập luyện - BoxingHub</title>
</head>
<body>

<div layout:fragment="content" th:with="activePage='history', pageTitle='Nhật ký tập luyện'">

    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="page-title">Nhật ký tập luyện</h1>
            <p class="page-subtitle text-muted">Danh sách các lớp học bạn đã tham gia hoặc đăng ký.</p>
        </div>
        <div class="card-box py-2 px-3 border-0 shadow-sm bg-white">
            <small class="text-muted fw-bold">Tổng số lớp:</small>
            <span class="h5 mb-0 ms-2 fw-bold text-danger" th:text="${member.enrolledClasses.size()}">0</span>
        </div>
    </div>

    <div class="card-box p-0 overflow-hidden border-0 shadow-sm bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                <tr>
                    <th class="ps-4 py-3" style="width: 20%">Ngày & Giờ</th>
                    <th style="width: 25%">Lớp học</th>
                    <th style="width: 20%">Huấn luyện viên</th>
                    <th class="text-center" style="width: 15%">Trạng thái</th>
                    <th class="text-center" style="width: 20%">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="gc : ${member.enrolledClasses}">
                    <td class="ps-4">
                        <div class="fw-bold" th:text="${#temporals.format(gc.schedule, 'dd/MM/yyyy')}"></div>
                        <small class="text-muted" th:text="${#temporals.format(gc.schedule, 'HH:mm')}"></small>
                    </td>
                    <td>
                        <div class="fw-bold text-dark" th:text="${gc.className}"></div>
                    </td>
                    <td>
                        <span class="text-muted small">
                            <i class="bi bi-person me-1"></i>
                            <span th:text="${gc.trainer != null ? gc.trainer.fullName : 'N/A'}"></span>
                        </span>
                    </td>
                    <td class="text-center">
                        <span th:if="${gc.schedule.isBefore(T(java.time.LocalDateTime).now())}"
                              class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                            <i class="bi bi-check2-circle me-1"></i> Hoàn thành
                        </span>
                        <span th:if="${gc.schedule.isAfter(T(java.time.LocalDateTime).now())}"
                              class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">
                            <i class="bi bi-clock-history me-1"></i> Sắp tới
                        </span>
                    </td>
                    <td class="text-center">
                        <button th:if="${gc.schedule.isBefore(T(java.time.LocalDateTime).now())}"
                                type="button"
                                class="btn btn-sm btn-outline-danger shadow-sm px-3"
                                th:data-trainer-id="${gc.trainer.id}"
                                th:data-trainer-name="${gc.trainer.fullName}"
                                onclick="openReviewModal(this.getAttribute('data-trainer-id'), this.getAttribute('data-trainer-name'))">
                            <i class="bi bi-star-fill me-1"></i> Đánh giá
                        </button>
                        <span th:unless="${gc.schedule.isBefore(T(java.time.LocalDateTime).now())}" class="text-muted small">---</span>
                    </td>
                </tr>

                <tr th:if="${member.enrolledClasses == null or member.enrolledClasses.isEmpty()}">
                    <td colspan="5" class="text-center py-5">
                        <div class="text-muted">
                            <i class="bi bi-inbox h2 d-block"></i>
                            Chưa có dữ liệu tập luyện.
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{member/fragments/review-modal :: reviewModal}"></div>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/member-review.js}"></script>
</th:block>

</body>
</html>
