<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="vi">
<head>
  <title>Đăng ký lịch tập - BoxingHub</title>
</head>
<body>

<div layout:fragment="content" th:with="activePage='schedule', pageTitle='Lịch tập mở rộng'">

  <div class="page-header">
    <div>
      <h1 class="page-title">Danh sách lớp học</h1>
      <p class="page-subtitle">Chọn lớp phù hợp để bắt đầu buổi tập của bạn.</p>
    </div>
  </div>

  <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4">
    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
  </div>
  <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" th:each="c : ${classes}">
      <div class="card-box h-100 d-flex flex-column justify-content-between border-top border-4"
           th:with="isEnrolled=${member.enrolledClasses.contains(c)}"
           th:styleappend="${isEnrolled} ? 'border-color: #0d6efd !important;' : (${c.currentEnrolled >= c.capacity} ? 'border-color: #6c757d !important;' : 'border-color: var(--red) !important;')">

        <div>
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h3 class="h5 mb-0 font-weight-bold" th:text="${c.className}">Boxing Cơ Bản</h3>
            <span th:if="${isEnrolled}" class="badge bg-primary px-3 py-2 shadow-sm">Đã đăng ký</span>
            <th:block th:unless="${isEnrolled}">
              <span th:if="${c.status.name() == 'OPEN'}" class="badge bg-success">Còn trống</span>
              <span th:if="${c.status.name() == 'FULL'}" class="badge bg-secondary">Hết chỗ</span>
            </th:block>
          </div>

          <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between text-muted" style="font-size: 0.9rem;">
                            <span>
                                <i class="bi bi-person-badge me-2 text-red"></i>
                                HLV: <strong th:text="${c.trainer != null ? c.trainer.fullName : 'N/A'}"></strong>
                            </span>
              <span th:if="${c.trainer != null}" class="badge bg-warning-subtle text-warning border border-warning-subtle px-2 py-1">
                                <i class="bi bi-star-fill me-1"></i>
                                <span th:text="${ratings.get(c.trainer.id) != null ? #numbers.formatDecimal(ratings.get(c.trainer.id), 1, 1) : '0.0'}"></span>
                            </span>
            </div>
          </div>

          <div class="mb-3 text-muted" style="font-size: 0.9rem;">
            <i class="bi bi-calendar3 me-2 text-red"></i>
            <span th:text="${#temporals.format(c.schedule, 'HH:mm - dd/MM/yyyy')}"></span>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between mb-1" style="font-size: 0.85rem;">
              <span>Sĩ số: <strong th:text="${c.currentEnrolled + '/' + c.capacity}"></strong></span>
            </div>
            <div class="progress" style="height: 6px; background: #eee;">
              <div class="progress-bar" role="progressbar"
                   th:style="'width: ' + (${c.currentEnrolled} * 100 / ${c.capacity}) + '%; background-color: ' + (${isEnrolled} ? '#0d6efd' : 'var(--red)') + ';'">
              </div>
            </div>
          </div>
        </div>

        <div class="mt-2">
          <form th:if="${isEnrolled}" th:action="@{/member/cancel/{id}(id=${c.id})}" method="post"
                onsubmit="return confirm('Hủy đăng ký lớp này?')">
            <button type="submit" class="btn btn-outline-danger w-100 py-2 shadow-sm">
              <i class="bi bi-x-circle me-1"></i> Hủy tham gia
            </button>
          </form>

          <form th:unless="${isEnrolled}" th:action="@{/member/enroll/{id}(id=${c.id})}" method="post">
            <button type="submit" class="btn-red w-100 py-2 shadow-sm"
                    th:disabled="${c.currentEnrolled >= c.capacity or c.status.name() != 'OPEN'}">
              <i class="bi bi-plus-circle me-1"></i> Đăng ký tham gia
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(classes)}">
      <div class="card-box shadow-sm">
        <i class="bi bi-calendar-x text-muted" style="font-size: 3rem;"></i>
        <p class="mt-3 text-muted">Hiện chưa có lớp học nào khả dụng.</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
