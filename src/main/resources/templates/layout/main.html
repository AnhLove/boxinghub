<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | BoxingHub Admin">BoxingHub Admin</title>

    <!-- LIB -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- 🔥 THEME CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <!-- 🔥 LAYOUT CSS -->
    <link rel="stylesheet" th:href="@{/css/layout.css}">

    <style>
        :root {
            --sidebar-w: 240px;
            --sidebar-col: 64px;
            --topbar-h: 56px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            transition: all 0.3s;
        }

        /* SIDEBAR */
        #sidebar {
            position: fixed;
            top: 0;           /* 🔥 FIX */
            left: 0;          /* nên có luôn */
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: 0.25s;
            z-index: 1000;    /* thêm để đè lên */
        }

        #sidebar.collapsed { width: var(--sidebar-col); }

        .sidebar-logo {
            height: var(--topbar-h);
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .logo-text { color: var(--red); font-weight: 700; }

        .nav-item-link {
            padding: 10px 18px;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            gap: 10px;
        }

        .nav-item-link:hover {
            background: var(--bg-4);
            color: var(--text);
        }

        .nav-item-link.active {
            color: var(--red);
            background: var(--red-glow);
        }

        /* TOPBAR */
        #topbar {
            position: fixed;
            top: 0;
            left: var(--sidebar-w);
            right: 0;
            height: var(--topbar-h);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            align-items: center;
            transition: 0.25s;
        }

        #topbar.collapsed { left: var(--sidebar-col); }

        /* MAIN */
        #main-content {
            margin-left: var(--sidebar-w);
            margin-top: var(--topbar-h);
            padding: 20px;
            transition: 0.25s;
        }

        #main-content.collapsed {
            margin-left: var(--sidebar-col);
        }

        /* BUTTON */
        .toggle-btn {
            background: var(--bg-4);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<aside id="sidebar">
    <div class="sidebar-logo">
        🥊 <span class="logo-text">BOXINGHUB</span>
    </div>

    <a href="/admin/dashboard" class="nav-item-link">Dashboard</a>
    <a href="/admin/members" class="nav-item-link">Học viên</a>
    <a href="/admin/trainers" class="nav-item-link">Huấn luyện viên</a>

    <div style="margin-top:auto;padding:10px;">
        <button class="toggle-btn" id="toggleBtn">
            <i class="bi bi-chevron-left" id="toggleIcon"></i>
        </button>
    </div>
</aside>

<!-- TOPBAR -->
<header id="topbar">
    <span>Admin Panel</span>

    <div style="display:flex; gap:10px; align-items:center;">

        <!-- 🌙 THEME -->
        <button class="toggle-btn" id="themeBtn">
            <i class="bi" id="themeIcon"></i>
        </button>

        <span class="admin-badge">ADMIN</span>
    </div>
</header>

<!-- MAIN -->
<main id="main-content">
    <div layout:fragment="content"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
