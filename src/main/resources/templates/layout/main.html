<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | BoxingHub Admin">BoxingHub Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --red:        #e53935;
            --red-dark:   #c62828;
            --red-glow:   rgba(229,57,53,0.15);
            --bg:         #080808;
            --bg-2:       #111111;
            --bg-3:       #1a1a1a;
            --bg-4:       #222222;
            --border:     #2a2a2a;
            --text:       #f0f0f0;
            --text-muted: #888;
            --sidebar-w:  240px;
            --sidebar-col: 64px;
            --topbar-h:   56px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
        }

        /* ── SIDEBAR ── */
        #sidebar {
            position: fixed; top: 0; left: 0;
            width: var(--sidebar-w); height: 100vh;
            background: var(--bg-2);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: width 0.25s ease;
            z-index: 1000; overflow: hidden;
        }
        #sidebar.collapsed { width: var(--sidebar-col); }

        .sidebar-logo {
            height: var(--topbar-h);
            display: flex; align-items: center;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap; gap: 12px; flex-shrink: 0;
        }
        .logo-icon { font-size: 1.4rem; color: var(--red); flex-shrink: 0; }
        .logo-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.25rem; font-weight: 700;
            color: var(--red); letter-spacing: 1px;
            opacity: 1; transition: opacity 0.2s;
        }
        #sidebar.collapsed .logo-text { opacity: 0; pointer-events: none; }

        .sidebar-nav { padding: 8px 0; flex: 1; overflow-y: auto; overflow-x: hidden; }

        .nav-section-label {
            font-size: 0.63rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-muted); padding: 12px 20px 4px;
            white-space: nowrap; transition: opacity 0.2s;
        }
        #sidebar.collapsed .nav-section-label { opacity: 0; }

        .nav-item-link {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 18px; color: var(--text-muted);
            text-decoration: none; white-space: nowrap;
            border-left: 3px solid transparent;
            font-size: 0.88rem; font-weight: 400;
            transition: all 0.18s ease;
        }
        .nav-item-link i { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
        .nav-item-link span { opacity: 1; transition: opacity 0.2s; }
        #sidebar.collapsed .nav-item-link span { opacity: 0; }
        .nav-item-link:hover { color: var(--text); background: var(--bg-4); border-left-color: var(--border); }
        .nav-item-link.active { color: var(--red); background: var(--red-glow); border-left-color: var(--red); font-weight: 500; }

        .sidebar-footer {
            height: 48px; display: flex; align-items: center;
            justify-content: flex-end; padding: 0 16px;
            border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .toggle-btn {
            background: var(--bg-4); border: 1px solid var(--border);
            color: var(--text-muted); border-radius: 6px;
            width: 32px; height: 32px; display: flex;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
        }
        .toggle-btn:hover { color: var(--red); border-color: var(--red); }

        /* ── TOPBAR ── */
        #topbar {
            position: fixed; top: 0;
            left: var(--sidebar-w); right: 0;
            height: var(--topbar-h);
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: left 0.25s ease; z-index: 999;
        }
        #topbar.collapsed { left: var(--sidebar-col); }
        .topbar-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px;
        }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .admin-badge {
            background: var(--red-glow); border: 1px solid var(--red);
            color: var(--red); font-size: 0.7rem; font-weight: 600;
            padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px;
        }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--red); display: flex; align-items: center;
            justify-content: center; font-size: 0.85rem; font-weight: 700;
            font-family: 'Barlow Condensed', sans-serif;
        }

        /* ── MAIN ── */
        #main-content {
            margin-left: var(--sidebar-w);
            margin-top: var(--topbar-h);
            padding: 28px;
            min-height: calc(100vh - var(--topbar-h));
            transition: margin-left 0.25s ease;
        }
        #main-content.collapsed { margin-left: var(--sidebar-col); }

        /* ── SHARED UI ── */
        .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.9rem; font-weight: 700; margin: 0 0 2px; letter-spacing: 0.5px; }
        .page-subtitle { color: var(--text-muted); font-size: 0.83rem; margin: 0; }

        .btn-red {
            background: var(--red); border: none; color: white;
            padding: 8px 18px; border-radius: 6px; font-size: 0.87rem;
            font-weight: 500; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background 0.18s; font-family: 'DM Sans', sans-serif;
        }
        .btn-red:hover { background: var(--red-dark); color: white; }

        .card-box { background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .card-box-header {
            padding: 13px 20px; border-bottom: 1px solid var(--border);
            font-size: 0.85rem; font-weight: 500; color: var(--text-muted);
            display: flex; align-items: center; gap: 8px;
        }

        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
        .admin-table thead th {
            background: var(--bg-4); color: var(--text-muted);
            font-weight: 500; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.8px;
            padding: 11px 16px; border-bottom: 1px solid var(--border);
        }
        .admin-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .admin-table tbody tr:last-child td { border-bottom: none; }
        .admin-table tbody tr:hover td { background: var(--bg-4); }

        .badge-pill {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.73rem; font-weight: 600; letter-spacing: 0.3px;
        }
        .badge-active     { background: rgba(76,175,80,0.12);  color: #4caf50; border: 1px solid #4caf5040; }
        .badge-inactive   { background: rgba(120,120,120,0.12); color: #888;   border: 1px solid #88888840; }
        .badge-beginner   { background: rgba(76,175,80,0.12);  color: #4caf50; border: 1px solid #4caf5040; }
        .badge-inter      { background: rgba(255,152,0,0.12);  color: #ff9800; border: 1px solid #ff980040; }
        .badge-advanced   { background: rgba(229,57,53,0.12);  color: #e53935; border: 1px solid #e5393540; }

        .btn-edit {
            background: transparent; border: 1px solid #ff9800; color: #ff9800;
            padding: 4px 11px; border-radius: 5px; font-size: 0.78rem;
            text-decoration: none; transition: all 0.15s;
        }
        .btn-edit:hover { background: rgba(255,152,0,0.1); color: #ff9800; }
        .btn-del {
            background: transparent; border: 1px solid var(--red); color: var(--red);
            padding: 4px 11px; border-radius: 5px; font-size: 0.78rem;
            text-decoration: none; transition: all 0.15s;
        }
        .btn-del:hover { background: var(--red-glow); color: var(--red); }

        /* Form */
        .form-label { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
        .form-control, .form-select {
            background: var(--bg-4); border: 1px solid var(--border);
            color: var(--text); border-radius: 6px; padding: 9px 12px;
            font-size: 0.87rem; font-family: 'DM Sans', sans-serif;
        }
        .form-control:focus, .form-select:focus {
            background: var(--bg-4); border-color: var(--red); color: var(--text);
            box-shadow: 0 0 0 3px var(--red-glow); outline: none;
        }
        .form-control::placeholder { color: #555; }
        .form-select option { background: var(--bg-3); }

        /* Stat card */
        .stat-card { background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .stat-icon.red { background: var(--red-glow); color: var(--red); }
        .stat-icon.green { background: rgba(76,175,80,0.12); color: #4caf50; }
        .stat-num { font-family: 'Barlow Condensed', sans-serif; font-size: 2.2rem; font-weight: 700; line-height: 1; margin-bottom: 2px; }
        .stat-label { font-size: 0.81rem; color: var(--text-muted); }

        .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; display: block; opacity: 0.3; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
    <div class="sidebar-logo">
        <span class="logo-icon">🥊</span>
        <span class="logo-text">BOXINGHUB</span>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="/admin/dashboard" class="nav-item-link"
           th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span>
        </a>

        <div class="nav-section-label">Quản lý</div>
        <a href="/admin/members" class="nav-item-link"
           th:classappend="${activePage == 'members'} ? ' active'">
            <i class="bi bi-people-fill"></i><span>Học viên</span>
        </a>
        <a href="/admin/trainers" class="nav-item-link"
           th:classappend="${activePage == 'trainers'} ? ' active'">
            <i class="bi bi-person-badge-fill"></i><span>Huấn luyện viên</span>
        </a>

        <div class="nav-section-label">Hệ thống</div>
        <a href="#" class="nav-item-link" style="opacity:.35;pointer-events:none">
            <i class="bi bi-person-lock"></i><span>User (sắp có)</span>
        </a>
        <a href="#" class="nav-item-link" style="opacity:.35;pointer-events:none">
            <i class="bi bi-gear-fill"></i><span>Cài đặt (sắp có)</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <button class="toggle-btn" id="toggleBtn">
            <i class="bi bi-chevron-left" id="toggleIcon"></i>
        </button>
    </div>
</aside>

<!-- TOPBAR -->
<header id="topbar">
    <span class="topbar-title" th:text="${pageTitle} ?: 'Admin Panel'">Admin Panel</span>
    <div class="topbar-right">
        <span class="admin-badge">ADMIN</span>
        <div class="avatar">A</div>
    </div>
</header>

<!-- MAIN CONTENT -->
<main id="main-content">
    <div layout:fragment="content"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebar = document.getElementById('sidebar');
    const topbar  = document.getElementById('topbar');
    const main    = document.getElementById('main-content');
    const icon    = document.getElementById('toggleIcon');

    if (localStorage.getItem('sb') === '1') {
        sidebar.classList.add('collapsed');
        topbar.classList.add('collapsed');
        main.classList.add('collapsed');
        icon.className = 'bi bi-chevron-right';
    }

    document.getElementById('toggleBtn').addEventListener('click', () => {
        const c = sidebar.classList.toggle('collapsed');
        topbar.classList.toggle('collapsed');
        main.classList.toggle('collapsed');
        icon.className = c ? 'bi bi-chevron-right' : 'bi bi-chevron-left';
        localStorage.setItem('sb', c ? '1' : '0');
    });
</script>
</body>
</html>
