<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | BoxingHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #d90429; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                              url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon { font-size: 3rem; color: var(--primary-color); margin-bottom: 15px; }
        h2 { color: #333; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .subtitle { color: #777; font-size: 0.9rem; margin-bottom: 28px; }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: left;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger  { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group .field-icon { position: absolute; left: 13px; top: 40px; color: #aaa; }
        .form-group .toggle-pw {
            position: absolute; right: 13px; top: 40px;
            color: #aaa; cursor: pointer; background: none; border: none; padding: 0;
        }
        .form-group .toggle-pw:hover { color: var(--primary-color); }

        .form-group input {
            width: 100%;
            padding: 12px 38px 12px 38px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(217,4,41,0.2);
        }

        /* Thanh độ mạnh mật khẩu */
        .strength-bar { height: 5px; border-radius: 3px; margin-top: 6px; background: #eee; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; transition: width 0.3s, background 0.3s; border-radius: 3px; }
        .strength-text { font-size: 0.78rem; margin-top: 4px; color: #888; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #ef233c; transform: translateY(-2px); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .back-link { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; font-size: 0.9rem; color: #666; }
        .back-link a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
        .footer-text { margin-top: 20px; font-size: 0.8rem; color: #999; }

        /* Trạng thái token hết hạn */
        .expired-box { text-align: center; }
        .expired-box .icon-expired { font-size: 3.5rem; color: #dc3545; margin-bottom: 15px; }
        .expired-box h3 { color: #333; }
        .expired-box p { color: #777; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="card">

    <!-- TRƯỜNG HỢP TOKEN KHÔNG HỢP LỆ / HẾT HẠN -->
    <div th:if="${error != null and token == null}" class="expired-box">
        <div class="icon-expired"><i class="fas fa-clock"></i></div>
        <h3>Link đã hết hạn</h3>
        <p th:text="${error}">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
        <a th:href="@{/forgot-password}" class="btn-submit" style="display:inline-block; text-decoration:none; padding: 12px 30px;">
            <i class="fas fa-redo" style="margin-right:6px;"></i> Gửi lại email
        </a>
        <div class="back-link"><a th:href="@{/login}"><i class="fas fa-arrow-left" style="margin-right:5px;"></i>Quay lại đăng nhập</a></div>
    </div>

    <!-- TRƯỜNG HỢP TOKEN HỢP LỆ — hiển thị form -->
    <div th:if="${token != null}">
        <div class="icon"><i class="fas fa-lock-open"></i></div>
        <h2>Đặt lại mật khẩu</h2>
        <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label>Mật khẩu mới</label>
                <i class="fas fa-lock field-icon"></i>
                <input type="password" name="newPassword" id="newPassword"
                       placeholder="Tối thiểu 6 ký tự" required minlength="6"
                       oninput="checkStrength(this.value)">
                <button type="button" class="toggle-pw" onclick="toggleVisibility('newPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <i class="fas fa-lock field-icon"></i>
                <input type="password" name="confirmPassword" id="confirmPassword"
                       placeholder="Nhập lại mật khẩu mới" required
                       oninput="checkMatch()">
                <button type="button" class="toggle-pw" onclick="toggleVisibility('confirmPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
                <div class="strength-text" id="matchText"></div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-check" style="margin-right:6px;"></i> Xác nhận đặt lại
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/login}"><i class="fas fa-arrow-left" style="margin-right:5px;"></i>Quay lại đăng nhập</a>
        </div>
    </div>

    <div class="footer-text">&copy; 2026 BoxingHub Management System</div>
</div>

<!-- JS -->
<script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
