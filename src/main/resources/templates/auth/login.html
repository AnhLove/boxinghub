<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BoxingHub Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d90429; /* Màu đỏ Boxing */
            --dark-bg: #1a1a1a;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                              url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-card p {
            color: #777;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 40px;
            color: #aaa;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(217, 4, 41, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-login:hover {
            background: #ef233c;
            transform: translateY(-2px);
        }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border: 1px solid #f5c6cb;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 15px;">
        <i class="fas fa-mitten"></i> <!-- Icon găng tay boxing -->
    </div>
    <h2>BoxingHub</h2>
    <p>Hệ thống quản lý phòng tập chuyên nghiệp</p>

    <!-- Thông báo lỗi -->
    <div th:if="${param.error}" class="error-msg">
        <i class="fas fa-exclamation-circle"></i> Email hoặc mật khẩu không chính xác!
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email Admin</label>
            <i class="fas fa-envelope"></i>
            <input type="email" name="username" placeholder="" required>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="" required>
        </div>

        <button type="submit" class="btn-login">Đăng nhập ngay</button>
    </form>

    <div class="footer-text">
        &copy; 2026 BoxingHub Management System
    </div>
</div>

</body>
</html>
