<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | BoxingHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d90429;
            --dark-bg: #1a1a1a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                              url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon { font-size: 3rem; color: var(--primary-color); margin-bottom: 15px; }
        h2 { color: #333; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .subtitle { color: #777; font-size: 0.9rem; margin-bottom: 28px; }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: left;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger  { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group i { position: absolute; left: 13px; top: 40px; color: #aaa; }
        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 38px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(217,4,41,0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #ef233c; transform: translateY(-2px); }

        .back-link { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; font-size: 0.9rem; color: #666; }
        .back-link a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
        .back-link a:hover { text-decoration: underline; }

        .footer-text { margin-top: 20px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon"><i class="fas fa-key"></i></div>
    <h2>Quên mật khẩu</h2>
    <p class="subtitle">Nhập email của bạn để nhận link đặt lại mật khẩu</p>

    <!-- Thông báo thành công -->
    <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${success}"></span>
    </div>

    <!-- Thông báo lỗi -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label>Địa chỉ Email</label>
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Nhập email đăng ký của bạn" required>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fas fa-paper-plane" style="margin-right:6px;"></i> Gửi link đặt lại
        </button>
    </form>

    <div class="back-link">
        <a th:href="@{/login}"><i class="fas fa-arrow-left" style="margin-right:5px;"></i>Quay lại đăng nhập</a>
    </div>

    <div class="footer-text">&copy; 2026 BoxingHub Management System</div>
</div>

</body>
</html>
