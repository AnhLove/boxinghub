<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia nhập BoxingHub | Đăng ký thành viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
        --primary-red: #d90429;
        --dark-bg: #121212;
        --card-bg: #1e1e1e;
        --input-bg: #2a2a2a;
    }

    body {
        background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)),
                    url('https://images.unsplash.com/photo-1594381898411-846e7d193883?auto=format&fit=crop&w=1350&q=80');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: #fff;
        display: flex;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .register-card {
        background: var(--card-bg);
        border: 1px solid #333;
        border-radius: 20px;
        padding: 45px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        position: relative;
        overflow: hidden;
    }

    /* Hiệu ứng dải màu đỏ ở đầu card */
    .register-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: var(--primary-red);
    }

    .text-red { color: var(--primary-red); }

    .form-group {
        margin-bottom: 20px;
        position: relative;
    }

    .form-group i {
        position: absolute;
        left: 15px;
        top: 42px;
        color: #666;
    }

    .form-label {
        font-weight: 600;
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 8px;
    }

    .form-control {
        background: var(--input-bg);
        border: 1px solid #444;
        color: #fff;
        padding: 12px 15px 12px 45px;
        border-radius: 10px;
        transition: 0.3s;
    }

    .form-control:focus {
        background: #333;
        border-color: var(--primary-red);
        color: #fff;
        box-shadow: 0 0 10px rgba(217, 4, 41, 0.2);
        outline: none;
    }

    .btn-red {
        background: var(--primary-red);
        color: #fff;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.4s;
        margin-top: 15px;
    }

    .btn-red:hover {
        background: #ef233c;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(217, 4, 41, 0.4);
        color: #fff;
    }

    .login-link {
        color: var(--primary-red);
        text-decoration: none;
        font-weight: 700;
        transition: 0.3s;
    }

    .login-link:hover {
        color: #ef233c;
        text-decoration: underline;
    }

    .header-icon {
        font-size: 2.5rem;
        color: var(--primary-red);
        margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="register-card">
        <div class="text-center mb-4">
          <div class="header-icon"><i class="fas fa-mitten"></i></div>
          <h2 class="fw-bold">BECOME A <span class="text-red">MEMBER</span></h2>
          <p class="text-secondary small">Bắt đầu hành trình chinh phục võ thuật ngay hôm nay</p>
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${error}" class="alert alert-danger border-0 mb-4 py-2"
             style="font-size: 0.85rem; background: rgba(220, 53, 69, 0.2); color: #ff8e97;" th:text="${error}">
        </div>

        <form th:action="@{/register}" th:object="${member}" method="post">

          <!-- Họ tên (thuộc member) -->
          <div class="form-group">
            <label class="form-label">Họ và tên</label>
            <i class="fas fa-user"></i>
            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nhập họ tên đầy đủ" required>
          </div>

          <!-- Email (thuộc user bên trong member) -->
          <div class="form-group">
            <label class="form-label">Email đăng nhập</label>
            <i class="fas fa-envelope"></i>
            <input type="email" th:field="*{user.email}" class="form-control" placeholder="example@gmail.com" required>
          </div>

          <!-- Mật khẩu (thuộc user bên trong member) -->
          <div class="form-group">
            <label class="form-label">Mật khẩu</label>
            <i class="fas fa-lock"></i>
            <input type="password" th:field="*{user.password}" class="form-control" placeholder="••••••••" required>
          </div>

          <!-- Điện thoại (thuộc member) -->
          <div class="form-group">
            <label class="form-label">Số điện thoại</label>
            <i class="fas fa-phone"></i>
            <input type="text" th:field="*{phone}" class="form-control" placeholder="Nhập số điện thoại">
          </div>

          <button type="submit" class="btn-red w-100">XÁC NHẬN ĐĂNG KÝ</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
          <span class="text-secondary small">Bạn đã có tài khoản?</span>
          <a th:href="@{/login}" class="login-link small ms-1">Đăng nhập ngay</a>
        </div>
      </div>

      <p class="text-center mt-4 text-secondary small" style="opacity: 0.6;">
        &copy; 2026 BoxingHub Management System
      </p>
    </div>
  </div>
</div>
</body>
</html>
